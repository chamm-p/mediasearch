# mediasearch config - Vorlage. Kopiere zu config.toml und passe an.
# Wird automatisch von tag.py und serve.py gelesen (neben den Scripts).

# --- LLM Endpoints ---
# Zwei Schreibweisen:
# 1) einzelner Endpoint per [llm] (siehe unten)
# 2) mehrere via [[llm.endpoints]] - dann werden sie nach 'least-busy'
#    verteilt: schnellere Endpoints bekommen automatisch mehr Last.

[llm]
# Globale Defaults; werden von einzelnen [[llm.endpoints]]-Bloecken
# uebernommen wenn dort api_key/model nicht gesetzt sind.
api_key = ""

[[llm.endpoints]]
endpoint = "http://localhost:8000/v1"
model    = "qwen2.5-vl-7b-instruct"
api_key  = ""

# Beispiel: zweiter Endpoint
# [[llm.endpoints]]
# endpoint = "http://192.168.1.10:1234/v1"
# model    = "qwen2-vl-7b-instruct"
# api_key  = ""

[tag]
workers       = 4
retry_errors  = false
# limit       = 500     # auskommentiert = unlimitiert; per CLI --limit N setzbar

[serve]
host = "127.0.0.1"          # 0.0.0.0 fuer LAN-Zugriff (kein Auth - vorsicht!)
port = 8765

# --- Zusaetzliche Datei-Endungen ---
# Werden zu den eingebauten dazugenommen (kleinschreibung, Punkt optional).
# Nuetzlich fuer Camcorder-/RAW-/Sonderformate, die per Default fehlen.
# Hinweis: Videos gehen ueber ffmpeg (fast alles ok). RAW-Bilder (.dng/.cr2/
# .nef/.arw...) werden zwar erkannt+gescannt, brauchen zum TAGGEN aber ggf.
# zusaetzliche Bibliotheken (PIL kann viele RAWs nicht direkt dekodieren).
[media]
# extra_image_exts = [".dng", ".cr2", ".nef", ".arw", ".rw2", ".orf", ".jfif"]
# extra_video_exts = [".mts", ".m2ts", ".mpo", ".ogv", ".m2v", ".divx"]

# --- Externe Viewer ---
# Kommando fuer Klick auf Bild / Video. Leer = xdg-open (System-Default).
# Beispiele: "qiv -f", "feh --fullscreen", "eog -f", "mpv --fs"
[viewers]
image = ""                  # z.B. "qiv -f" fuer Fullscreen
video = ""                  # z.B. "mpv --fs"
